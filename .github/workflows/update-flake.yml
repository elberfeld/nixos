name: Update Flake und Build

on:
  schedule:
    - cron: '0 3 * * *'  # täglich 3 Uhr UTC
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Bei Pull Requests wird flake.lock nicht angefasst, nur der bestehende Stand gebaut.
      - name: Update flake.lock
        if: github.event_name != 'pull_request'
        run: nix flake update

      - name: Prüfen ob gebaut werden soll
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: flake.lock als Artifact speichern
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - void-desktop
          - void-carbonx1
          - adesso-wsl

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Aktualisierte flake.lock laden
        uses: actions/download-artifact@v7
        with:
          name: flake-lock

      - name: Speicherplatz freigeben
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: elberfeld
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.host }}
        run: |
          set -o pipefail
          nix build '.#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel' \
            --accept-flake-config \
            --no-link \
            --print-build-logs 2>&1 | tee build-${{ matrix.host }}.log

      # Wird auch bei Erfolg hochgeladen, damit opencode-autofix bei Bedarf
      # den vollständigen Kontext aller Hosts hat, ohne selbst neu zu bauen.
      - name: Build-Log als Artifact speichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.host }}
          path: build-${{ matrix.host }}.log
          if-no-files-found: ignore

  push:
    needs: [update, build]
    # Nicht bei Pull Requests pushen, da flake.lock dort unangetastet bleibt.
    if: needs.update.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Aktualisierte flake.lock laden
        uses: actions/download-artifact@v7
        with:
          name: flake-lock

      - name: Commit und push (nur bei Änderungen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --staged --quiet; then
            echo "flake.lock unverändert – kein Commit nötig"
          else
            git commit -m "Update flake.lock by GitHub Actions"
            git push
          fi
