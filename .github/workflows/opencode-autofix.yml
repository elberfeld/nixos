name: Auto-Fix bei fehlgeschlagenem Flake-Update

# Läuft, sobald der Workflow "Update Flake und Build" abgeschlossen ist.
#
# Benötigte Konfiguration unter Settings -> Secrets and variables -> Actions:
#   Variables (Tab "Variables"):
#     OPENAI_COMPATIBLE_BASE_URL  - API-Endpunkt, z.B. https://openrouter.ai/api/v1
#     OPENAI_COMPATIBLE_MODEL     - Modell-ID des Endpunkts, z.B. anthropic/claude-sonnet-4.5
#     CACHIX_CACHE_NAME           - Name des Cachix-Caches
#     AUTOFIX_PR_PREFIX           - PR-Titel-Präfix, z.B. Opencode-Autofix
#   Secrets (Tab "Secrets"):
#     OPENAI_COMPATIBLE_API_KEY   - API-Key für den Endpunkt
#     CACHIX_AUTH_TOKEN           - Auth-Token für den Cachix-Cache
#     PR_TOKEN                    - Personal Access Token (Scope "repo") oder GitHub-App-Token
#                                   mit PR-Rechten. Das automatisch generierte GITHUB_TOKEN darf
#                                   auf GitHub grundsätzlich keine Pull Requests erstellen, auch
#                                   nicht mit "permissions: pull-requests: write" - das ist eine
#                                   Plattform-Beschränkung gegen Workflow-Eskalation, keine
#                                   Fehlkonfiguration hier. Ohne PR_TOKEN scheitert `gh pr create`
#                                   im letzten Schritt. Ist das Secret nicht gesetzt, fällt der
#                                   Workflow auf GITHUB_TOKEN zurück (Fix wird dann zwar gebaut
#                                   und committet, aber kein PR geöffnet).
on:
  workflow_run:
    workflows: ["Update Flake und Build"]
    types: [completed]
  # Manueller Start ueber Actions -> "Auto-Fix bei fehlgeschlagenem Flake-Update" -> Run workflow.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional: Run-ID oder Run-Number (z.B. 102) von 'Update Flake und Build'. Leer = letzter fehlgeschlagener Lauf."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  # Präfix für den Titel des Autofix-PRs, wird auch zur Duplikatserkennung genutzt.
  AUTOFIX_PR_PREFIX: ${{ vars.AUTOFIX_PR_PREFIX }}

jobs:
  check-open-pr:
    # Verhindert Duplikate und reagiert nur auf fehlgeschlagene Builds des main-Branches
    # (update-flake läuft inzwischen auch für Pull Requests, die hier nicht gemeint sind).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      pr_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Prüfen ob bereits ein offener Opencode-Autofix-PR existiert
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" --state open \
            --search "${{ env.AUTOFIX_PR_PREFIX }} in:title" --json number --jq 'length')
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  autofix:
    needs: check-open-pr
    if: needs.check-open-pr.outputs.pr_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Stand des fehlgeschlagenen bzw. aktuellen Laufs)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: true

      # Beim manuellen Start ist die 11-stellige Run-ID schlecht auffindbar, in der
      # Actions-Liste steht nur die kurze Run-Number (z.B. 102). Hier werden daher
      # beide akzeptiert; ohne Eingabe wird der letzte fehlgeschlagene Lauf genommen.
      - name: Run-ID von "Update Flake und Build" ermitteln
        id: source-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ -n "$EVENT_RUN_ID" ]; then
            # Von workflow_run ausgelöst: Die ID steht schon im Event.
            run_id="$EVENT_RUN_ID"
          elif [ -z "$INPUT_RUN_ID" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow update-flake.yml --branch main --status failure \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            echo "Keine Run-ID angegeben, nutze letzten fehlgeschlagenen Lauf: ${run_id:-keiner gefunden}"
          else
            # Eingabe gegen databaseId und number prüfen, damit beides funktioniert.
            case "$INPUT_RUN_ID" in
              ''|*[!0-9]*)
                echo "::error::run_id muss eine Zahl sein, war aber '$INPUT_RUN_ID'."
                exit 1
                ;;
            esac
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow update-flake.yml --limit 200 --json databaseId,number \
              --jq "map(select(.databaseId == $INPUT_RUN_ID or .number == $INPUT_RUN_ID)) | .[0].databaseId // empty")
          fi

          if [ -z "$run_id" ]; then
            echo "::error::Kein passender Lauf von 'Update Flake und Build' gefunden (Eingabe: '${INPUT_RUN_ID:-<leer>}'). Erlaubt sind Run-ID und Run-Number der letzten 200 Läufe."
            exit 1
          fi

          echo "Verwende Lauf $run_id: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Aktualisierte flake.lock aus fehlgeschlagenem Lauf laden
        id: download-lock
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: flake-lock
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source-run.outputs.id }}

      # Von "Update Flake und Build" bereits gesammelte Build-Logs aller Hosts laden,
      # damit hier nicht nochmal selbst gebaut werden muss um an die Fehlermeldung zu kommen.
      - name: Build-Logs aus dem Update-Flake-Lauf laden
        id: download-logs
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: build-log-*
          path: build-logs
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source-run.outputs.id }}

      # Läuft absichtlich vor der teuren Nix-Installation: Ohne Build-Logs hat
      # OpenCode keine Fehlermeldung zu analysieren, dann lieber sofort abbrechen
      # statt erst mehrere Minuten Setup und einen LLM-Aufruf zu verbrennen.
      - name: Artefakte prüfen
        env:
          RUN_ID: ${{ steps.source-run.outputs.id }}
        run: |
          set -euo pipefail

          if [ -z "$(ls -A build-logs 2>/dev/null || true)" ]; then
            echo "::error::Lauf $RUN_ID enthält keine build-log-* Artefakte. Ohne sie kann die Fehlerursache nicht ermittelt werden."
            exit 1
          fi
          ls -la build-logs/

          if [ "${{ steps.download-lock.outcome }}" != "success" ]; then
            echo "::warning::flake.lock-Artefakt aus Lauf $RUN_ID nicht verfügbar. Analyse läuft gegen die eingecheckte flake.lock."
          fi

      - name: Speicherplatz freigeben
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Bindet einen beliebigen OpenAI-kompatiblen Endpunkt über generische
      # Variablen ein (URL, Key, Modell), statt einen festen Provider zu verdrahten.
      # Liegt in der globalen Config und nicht im Repo, damit die Datei nicht
      # versehentlich im Autofix-PR mitcommittet wird.
      - name: OpenCode-Konfiguration für OpenAI-kompatiblen Endpunkt erzeugen
        env:
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL }}
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "provider": {
              "customai": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Custom OpenAI-compatible",
                "options": {
                  "baseURL": "${OPENAI_COMPATIBLE_BASE_URL}",
                  "apiKey": "{env:OPENAI_COMPATIBLE_API_KEY}"
                },
                "models": {
                  "${OPENAI_COMPATIBLE_MODEL}": {}
                }
              }
            }
          }
          EOF

      # Bewusst die CLI statt anomalyco/opencode/github: Diese Action wertet das
      # GitHub-Event aus, um ihren Fortschritt in einen Issue- bzw. PR-Kommentar
      # zu schreiben. Sie unterstützt daher nur issue_comment, issues,
      # pull_request, pull_request_review_comment, schedule und
      # workflow_dispatch und bricht bei workflow_run sofort mit
      # "Unsupported event type: workflow_run" ab.
      - name: OpenCode installieren
        run: curl -fsSL https://opencode.ai/install | bash

      # Ohne Identität scheitert der Commit, den OpenCode in Schritt 4 anlegen soll.
      - name: Git-Identität für Autofix-Commits setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: OpenCode Fehleranalyse und Fix
        env:
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          # gh liest GH_TOKEN und legt damit Branch und Pull Request an. Das
          # Standard-GITHUB_TOKEN darf plattformseitig keine PRs erstellen
          # (siehe Kommentar zu PR_TOKEN oben), daher hier bevorzugt PR_TOKEN.
          GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/autofix-prompt.txt" <<'PROMPT'
          Der geplante Workflow "Update Flake und Build" ist fehlgeschlagen, nachdem
          flake.lock aktualisiert wurde. Die Build-Logs aller Hosts aus diesem Lauf
          liegen bereits im Verzeichnis build-logs/ (eine Datei pro Host, z.B.
          build-logs/build-void-desktop.log). Du musst die Konfiguration NICHT selbst
          neu bauen, um den Fehler zu finden - lies stattdessen direkt diese Logs.

          1. Lies alle Dateien in build-logs/ und analysiere die Ursache des Fehlers.
          2. Versuche den Fehler durch Anpassungen an den .nix-Dateien oder an flake.lock
             zu beheben.
          3. Verifiziere jeden Fix, indem du für die betroffenen Hosts
             `nix build .#nixosConfigurations.<host>.config.system.build.toplevel --accept-flake-config --no-link`
             ausführst.
          4. Nur wenn der Build für alle Hosts (void-desktop, void-carbonx1, adesso-wsl)
             erfolgreich ist: erstelle einen neuen Branch, committe alle Änderungen
             (inklusive flake.lock) und öffne mit `gh pr create` einen Pull Request.
             Git-Identität und GH_TOKEN sind bereits gesetzt. Der PR-Titel MUSS mit
             "${{ env.AUTOFIX_PR_PREFIX }}: " beginnen, gefolgt von einer kurzen Beschreibung des
             gefundenen Problems und des Fixes. Committe ausschliesslich Dateien, die
             zum Fix gehören - insbesondere nicht das Verzeichnis build-logs/.
          5. Findest du keinen erfolgreichen Fix, nimm keine Änderungen am Repository vor
             und beschreibe stattdessen im Log, was du versucht hast und woran es
             gescheitert ist.
          PROMPT

          # --auto ist in CI nötig: Es gibt kein TTY, um Datei- und Shell-Zugriffe
          # interaktiv zu bestätigen.
          opencode run \
            --model "customai/${{ vars.OPENAI_COMPATIBLE_MODEL }}" \
            --auto \
            "$(cat "$RUNNER_TEMP/autofix-prompt.txt")"
